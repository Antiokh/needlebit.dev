name: Sync from needlebit-marketing

on:
  repository_dispatch:
    types:
      - needlebit-dev-content-updated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-needlebit-marketing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out needlebit.dev
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Check out needlebit-marketing
        uses: actions/checkout@v4
        with:
          repository: Antiokh/needlebit-marketing
          ref: ${{ github.event.client_payload.sha || 'main' }}
          token: ${{ secrets.NEEDLEBIT_SYNC_TOKEN }}
          path: _marketing

      - name: Synchronize published root
        working-directory: _site
        run: |
          set -euo pipefail
          source_dir="../_marketing/needlebit.dev"
          test -f "$source_dir/.sync-root"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.env' \
            --exclude='.sync-root' \
            --exclude='.needlebit-marketing-files' \
            --exclude='DEPLOY.txt' \
            "$source_dir/" ./

      - name: Commit and push synchronized files
        working-directory: _site
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha || 'manual' }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || 'Antiokh/needlebit-marketing' }}
          SOURCE_URL: ${{ github.event.client_payload.source_url || '' }}
          SOURCE_MESSAGE: ${{ github.event.client_payload.message || 'Manual sync from needlebit-marketing' }}
          SOURCE_AUTHOR: ${{ github.event.client_payload.author || '' }}
          SOURCE_AUTHOR_EMAIL: ${{ github.event.client_payload.author_email || '' }}
          SOURCE_FOLDER: needlebit.dev
        run: |
          set -euo pipefail
          git config user.name "NeedleBit marketing sync"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No website changes to sync."
            exit 0
          fi

          git add -A
          subject="$(printf '%s\n' "$SOURCE_MESSAGE" | sed -n '1p')"
          [ -n "$subject" ] || subject="Sync from needlebit-marketing"

          {
            printf '%s [skip needlebit-sync]\n\n' "$subject"
            printf 'Original source commit message:\n\n%s\n\n' "$SOURCE_MESSAGE"
            printf 'Sync metadata:\n\n'
            printf '%s\n' "- Source repository: $SOURCE_REPO"
            printf '%s\n' "- Source folder: $SOURCE_FOLDER"
            printf '%s\n' "- Source commit: $SOURCE_SHA"
            if [ -n "$SOURCE_URL" ]; then
              printf '%s\n' "- Source URL: $SOURCE_URL"
            fi
            if [ -n "$SOURCE_AUTHOR" ]; then
              printf '%s' "- Source author: $SOURCE_AUTHOR"
              if [ -n "$SOURCE_AUTHOR_EMAIL" ]; then
                printf ' <%s>' "$SOURCE_AUTHOR_EMAIL"
              fi
              printf '\n'
            fi
            printf '%s\n' "- Sync workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/needlebit-sync-message.txt

          git commit -F /tmp/needlebit-sync-message.txt

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            git pull --rebase origin main
            sleep 5
          done
